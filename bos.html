<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelaporan BOSP</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS untuk parsing Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Pengaturan khusus saat mencetak dokumen */
        @media print {
            body { background-color: white; }
            #sidebar, #top-navbar, header, .no-print { display: none !important; }
            #main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
            .print-document { 
                padding: 0 !important; 
                box-shadow: none !important; 
                border: none !important; 
                width: 100%;
            }
            .print-break { page-break-after: always; }
        }

        /* Animasi loading */
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Styling Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-x-hidden h-screen flex flex-col">

    <!-- Container Utama Aplikasi -->
    <div id="app-container" class="h-full w-full flex"></div>

    <!-- Modal Kustom untuk Peringatan/Konfirmasi -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-[100] hidden flex items-center justify-center backdrop-blur-sm no-print">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 transform transition-all scale-95 opacity-0 duration-200" id="modal-content">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modal-icon" class="text-2xl"></div>
                <h3 id="modal-title" class="text-xl font-bold text-slate-800"></h3>
            </div>
            <p id="modal-message" class="text-slate-600 mb-6 leading-relaxed"></p>
            <div class="flex justify-end space-x-3">
                <button id="modal-btn-cancel" class="hidden px-4 py-2 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200 transition-colors">Batal</button>
                <button id="modal-btn-confirm" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm">OK</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[200] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="loader border-4 border-slate-200 rounded-full w-12 h-12 mb-4"></div>
        <p class="text-slate-500 font-medium animate-pulse">Memuat data...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase dari pengguna
        const firebaseConfig = {
            apiKey: "AIzaSyDuBDipoj-CLjozI5pOhP_YtdWeBbOYS9c",
            authDomain: "laporanbos-e5f42.firebaseapp.com",
            databaseURL: "https://laporanbos-e5f42-default-rtdb.firebaseio.com",
            projectId: "laporanbos-e5f42",
            storageBucket: "laporanbos-e5f42.firebasestorage.app",
            messagingSenderId: "437411137782",
            appId: "1:437411137782:web:6fd8b6e584a9ce0cff84d7",
            measurementId: "G-JJLLV51JEV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path penyimpanan mematuhi aturan strict path
        const sysAppId = typeof __app_id !== 'undefined' ? __app_id : 'pelaporan-bosp-default';
        const basePath = `artifacts/${sysAppId}/public/data`;

        let currentUser = null;
        let userData = null; 
        let schoolData = {}; 
        let userBKU = []; 
        let isSystemMaintenance = false; // State global untuk fitur perbaikan server
        
        // State untuk Admin
        let allUsersList = [];
        let allSchoolsList = [];
        let allBKUList = [];

        let currentView = 'dashboard';
        let unsubscribes = [];

        const UI = {
            showLoading: () => document.getElementById('loading-overlay').classList.remove('hidden', 'opacity-0'),
            hideLoading: () => {
                const el = document.getElementById('loading-overlay');
                el.classList.add('opacity-0');
                setTimeout(() => el.classList.add('hidden'), 300);
            },
            formatRupiah: (number) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number || 0);
            },
            formatDate: (dateString) => {
                if(!dateString) return '-';
                const d = new Date(dateString);
                return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            },
            formatTanggalTerbilang: (dateString) => {
                if(!dateString) return '.............';
                const d = new Date(dateString);
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                const dayName = days[d.getDay()];
                const dayNum = UI.terbilangKata(d.getDate());
                const monthName = months[d.getMonth()];
                const yearNum = UI.terbilangKata(d.getFullYear());
                return `Pada hari ini, ${dayName} tanggal ${dayNum}, Bulan ${monthName} Tahun ${yearNum}`;
            },
            terbilangKata: (angka) => {
                angka = Math.abs(parseInt(angka) || 0);
                const huruf = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas", "Dua Belas", "Tiga Belas", "Empat Belas", "Lima Belas", "Enam Belas", "Tujuh Belas", "Delapan Belas", "Sembilan Belas", "Dua Puluh", "Dua Puluh Satu", "Dua Puluh Dua", "Dua Puluh Tiga", "Dua Puluh Empat", "Dua Puluh Lima", "Dua Puluh Enam", "Dua Puluh Tujuh", "Dua Puluh Delapan", "Dua Puluh Sembilan", "Tiga Puluh", "Tiga Puluh Satu"];
                if(angka < huruf.length) return huruf[angka];
                if(angka < 100) return UI.terbilangKata(Math.floor(angka/10)) + " Puluh " + huruf[angka%10];
                if(angka < 1000) return "Seribu " + UI.terbilangKata(angka - 1000);
                if(angka < 3000) return "Dua Ribu " + UI.terbilangKata(angka - 2000);
                return angka.toString();
            },
            showAlert: (title, message, type = 'info', showCancel = false) => {
                return new Promise((resolve) => {
                    const modal = document.getElementById('custom-modal');
                    const content = document.getElementById('modal-content');
                    const iconEl = document.getElementById('modal-icon');
                    const btnCancel = document.getElementById('modal-btn-cancel');
                    const btnConfirm = document.getElementById('modal-btn-confirm');
                    
                    document.getElementById('modal-title').textContent = title;
                    document.getElementById('modal-message').textContent = message;
                    
                    iconEl.className = 'text-2xl ' + (type === 'error' ? 'text-red-500 fas fa-exclamation-circle' : 
                                       type === 'success' ? 'text-green-500 fas fa-check-circle' : 
                                       type === 'warning' ? 'text-yellow-500 fas fa-exclamation-triangle' : 'text-blue-500 fas fa-info-circle');

                    if(showCancel) btnCancel.classList.remove('hidden');
                    else btnCancel.classList.add('hidden');

                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        content.classList.remove('scale-95', 'opacity-0');
                        content.classList.add('scale-100', 'opacity-100');
                    }, 10);

                    const cleanup = () => {
                        content.classList.remove('scale-100', 'opacity-100');
                        content.classList.add('scale-95', 'opacity-0');
                        setTimeout(() => modal.classList.add('hidden'), 200);
                        btnConfirm.onclick = null;
                        btnCancel.onclick = null;
                    };

                    btnConfirm.onclick = () => { cleanup(); resolve(true); };
                    btnCancel.onclick = () => { cleanup(); resolve(false); };
                });
            },
            terbilang: (angka) => {
                angka = Math.abs(angka);
                const huruf = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
                let temp = "";
                if (angka < 12) { temp = " " + huruf[angka]; }
                else if (angka < 20) { temp = UI.terbilang(angka - 10) + " Belas"; }
                else if (angka < 100) { temp = UI.terbilang(Math.floor(angka / 10)) + " Puluh" + UI.terbilang(angka % 10); }
                else if (angka < 200) { temp = " Seratus" + UI.terbilang(angka - 100); }
                else if (angka < 1000) { temp = UI.terbilang(Math.floor(angka / 100)) + " Ratus" + UI.terbilang(angka % 100); }
                else if (angka < 2000) { temp = " Seribu" + UI.terbilang(angka - 1000); }
                else if (angka < 1000000) { temp = UI.terbilang(Math.floor(angka / 1000)) + " Ribu" + UI.terbilang(angka % 1000); }
                else if (angka < 1000000000) { temp = UI.terbilang(Math.floor(angka / 1000000)) + " Juta" + UI.terbilang(angka % 1000000); }
                return temp.trim() + " Rupiah";
            }
        };

        function renderAuthScreen() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-100 p-4 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-x-1/2 -translate-y-1/2"></div>
                    <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 translate-x-1/2 translate-y-1/2"></div>
                    
                    <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-2xl shadow-xl border border-white/50 p-8 relative z-10">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                                <i class="fas fa-file-invoice-dollar text-2xl text-white"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-800">Pelaporan BOSP</h2>
                            <p class="text-slate-500 text-sm mt-2" id="auth-subtitle">Silakan masuk ke akun Anda</p>
                        </div>

                        <form id="login-form" class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-user text-slate-400"></i>
                                    </div>
                                    <input type="text" id="login-email" required class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white/50" placeholder="Contoh: Gordi atau admin@sekolah.com">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-slate-400"></i>
                                    </div>
                                    <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white/50" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-md shadow-blue-200 flex justify-center items-center">
                                Masuk <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                            <p class="text-center text-sm text-slate-600 mt-4">Belum punya akun? <a href="#" id="show-register" class="text-blue-600 font-semibold hover:underline">Daftar Baru</a></p>
                        </form>

                        <form id="register-form" class="space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Daftar Sebagai</label>
                                <select id="reg-role" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white/50">
                                    <option value="user">Pengguna Sekolah</option>
                                    <option value="admin">Admin Dinas</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                                <input type="email" id="reg-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white/50" placeholder="email@sekolah.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                <input type="password" id="reg-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white/50" minlength="6" placeholder="Minimal 6 karakter">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-md shadow-indigo-200 mt-2">
                                Buat Akun
                            </button>
                            <p class="text-center text-sm text-slate-600 mt-4">Sudah punya akun? <a href="#" id="show-login" class="text-indigo-600 font-semibold hover:underline">Masuk</a></p>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('show-register').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').textContent = 'Buat akun baru untuk mengakses sistem';
            });
            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-subtitle').textContent = 'Silakan masuk ke akun Anda';
            });

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.showLoading();
                
                let inputId = document.getElementById('login-email').value.trim();
                let password = document.getElementById('login-password').value;
                
                let emailToLogin = inputId;
                if (inputId.toLowerCase() === 'admin') {
                    emailToLogin = 'admin.utama@bosp.admin.com';
                }

                try {
                    await signInWithEmailAndPassword(auth, emailToLogin, password);
                } catch (error) {
                    if (inputId.toLowerCase() === 'admin' && (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password')) {
                        try {
                            const cred = await createUserWithEmailAndPassword(auth, emailToLogin, password);
                            await setDoc(doc(db, `${basePath}/users`, cred.user.uid), {
                                uid: cred.user.uid,
                                email: 'Admin (Admin Utama)',
                                role: 'admin',
                                isVerified: true,
                                createdAt: new Date().toISOString()
                            });
                            return; 
                        } catch (createErr) {
                            UI.hideLoading();
                            UI.showAlert('Pembuatan Akun Admin Gagal', createErr.message, 'error');
                            return;
                        }
                    }

                    UI.hideLoading();
                    UI.showAlert('Login Gagal', 'Periksa kembali Username/Email dan Password Anda.', 'error');
                }
            });

            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.showLoading();
                try {
                    const role = document.getElementById('reg-role').value;
                    const cred = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
                    
                    await setDoc(doc(db, `${basePath}/users`, cred.user.uid), {
                        uid: cred.user.uid,
                        email: cred.user.email,
                        role: role,
                        isVerified: role === 'admin' ? true : false,
                        createdAt: new Date().toISOString()
                    });
                } catch (error) {
                    UI.hideLoading();
                    UI.showAlert('Registrasi Gagal', error.message, 'error');
                }
            });
        }

        function renderMainLayout() {
            const container = document.getElementById('app-container');
            const isAdmin = userData?.role === 'admin';
            
            let menus = [];
            if (isAdmin) {
                menus = [
                    { id: 'dashboard', icon: 'fa-chart-pie', text: 'Dashboard Admin' },
                    { id: 'verify', icon: 'fa-user-check', text: 'Verifikasi Pengguna' },
                    { id: 'recap', icon: 'fa-file-contract', text: 'Rekap Progres' }
                ];
            } else {
                // Jika user biasa dan status maintenance aktif, kosongkan menu
                if (!isSystemMaintenance) {
                    menus = [
                        { id: 'dashboard', icon: 'fa-home', text: 'Dashboard' },
                        { id: 'profile', icon: 'fa-school', text: 'Data Profil Sekolah' },
                        { id: 'kop', icon: 'fa-heading', text: 'Pengaturan Kop & Logo' },
                        { id: 'bku', icon: 'fa-book', text: 'Buku Kas Umum (BKU)' },
                        { id: 'kwitansi', icon: 'fa-receipt', text: 'Cetak Kwitansi' },
                        { id: 'nota', icon: 'fa-file-invoice', text: 'Cetak Nota Pesan' },
                        { id: 'berita', icon: 'fa-file-signature', text: 'Cetak Berita Acara' }
                    ];
                }
            }

            const sidebarHtml = menus.map(m => `
                <a href="#" data-menu="${m.id}" class="sidebar-link flex items-center px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors mb-1 ${currentView === m.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50 hover:bg-blue-600' : ''}">
                    <i class="fas ${m.icon} w-6 text-center mr-2"></i>
                    <span class="font-medium text-sm">${m.text}</span>
                </a>
            `).join('');

            container.innerHTML = `
                <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20 transition-all duration-300 print:hidden">
                    <div class="h-16 flex items-center px-6 border-b border-slate-800">
                        <i class="fas fa-file-invoice-dollar text-blue-500 text-2xl mr-3"></i>
                        <span class="font-bold text-lg tracking-wide">BOSP<span class="text-blue-500 font-black">.</span>APP</span>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto">
                        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 px-2">Menu Utama</div>
                        <nav id="sidebar-nav">${sidebarHtml}</nav>
                    </div>
                    <div class="p-4 border-t border-slate-800">
                        <div class="flex items-center px-2 py-3 bg-slate-800 rounded-lg mb-2">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold uppercase mr-3">
                                ${userData?.email?.charAt(0) || 'U'}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-medium truncate">${userData?.email}</p>
                                <p class="text-xs text-slate-400 capitalize">${userData?.role}</p>
                            </div>
                        </div>
                        <button id="btn-logout" class="w-full flex items-center justify-center px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors">
                            <i class="fas fa-sign-out-alt mr-2"></i> Keluar
                        </button>
                    </div>
                </aside>

                <div id="main-wrapper" class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden relative">
                    <header id="top-navbar" class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10 shadow-sm print:hidden">
                        <div class="flex items-center">
                            <button id="btn-toggle-sidebar" class="text-slate-500 hover:text-slate-700 mr-4 md:hidden">
                                <i class="fas fa-bars text-xl"></i>
                            </button>
                            <h1 id="page-title" class="text-xl font-bold text-slate-800 capitalize"></h1>
                        </div>
                        <div class="flex items-center space-x-4 text-sm">
                            ${!userData?.isVerified ? '<span class="px-3 py-1 bg-red-100 text-red-700 rounded-full font-medium flex items-center"><i class="fas fa-times-circle mr-1"></i> Belum Diverifikasi</span>' : '<span class="px-3 py-1 bg-green-100 text-green-700 rounded-full font-medium flex items-center"><i class="fas fa-check-circle mr-1"></i> Terverifikasi</span>'}
                        </div>
                    </header>

                    <main id="main-content" class="flex-1 overflow-y-auto p-6 relative"></main>
                </div>
            `;

            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if(!userData.isVerified && userData.role === 'user') {
                        UI.showAlert('Akses Ditolak', 'Akun Anda belum diverifikasi oleh Admin. Silakan tunggu.', 'warning');
                        return;
                    }
                    const menu = e.currentTarget.getAttribute('data-menu');
                    switchMenu(menu);
                });
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                UI.showAlert('Konfirmasi Keluar', 'Apakah Anda yakin ingin keluar?', 'warning', true).then(res => {
                    if(res) signOut(auth);
                });
            });
        }

        function switchMenu(menuId) {
            // Override menu jika user dan sedang maintenance
            if (userData.role === 'user' && isSystemMaintenance) {
                menuId = 'maintenance';
            }

            currentView = menuId;
            
            // Highlight sidebar link
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if(link.getAttribute('data-menu') === menuId) {
                    link.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-900/50');
                    link.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                } else {
                    link.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-900/50');
                    link.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                }
            });

            const titleMap = {
                'dashboard': 'Dashboard', 'verify': 'Verifikasi Pengguna', 'recap': 'Rekap Progres',

                        let count = 0;

                            let dateStr = '';

                    if(currentView === 'recap') switchMenu(currentView);

                    if(currentView === 'profile' || currentView === 'dashboard') switchMenu(currentView);
                }, e => console.error(e)));

                    const allB = snap.docs.map(d => ({id: d.id, ...d.data()}));

                    userBKU = myBku.map(item => {
                        saldo = saldo + (item.penerimaan || 0) - (item.pengeluaran || 0);
                        return { ...item, saldo: saldo };
                    });

                    if(currentView === 'bku' || currentView === 'dashboard') switchMenu(currentView);
                }, e => console.error(e)));
            }
        }

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            UI.showLoading();
            
            if (user) {
                try {
                    // Fetch initial status maintenance sebelum render layout
                    const sysRef = doc(db, `${basePath}/settings`, 'system');
                    const sysSnap = await getDoc(sysRef);
                    isSystemMaintenance = sysSnap.exists() ? (sysSnap.data().isMaintenance || false) : false;

                    unsubscribes.push(onSnapshot(doc(db, `${basePath}/users`, user.uid), (docSnap) => {
                        if (docSnap.exists()) {
                            const wasVerified = userData ? userData.isVerified : false;
                            userData = docSnap.data();
                            
                            if(!wasVerified && userData.isVerified && currentView !== 'dashboard') {
                                UI.showAlert('Informasi', 'Akun Anda telah diverifikasi oleh Admin!', 'success');
                                currentView = 'dashboard'; 
                            }
                            
                            if(!document.getElementById('sidebar')) {
                                renderMainLayout();
                                subscribeData();
                                // Paksa ke menu maintenance jika status aktif
                                if (userData.role === 'user' && isSystemMaintenance) {
                                    switchMenu('maintenance');
                                } else {
                                    switchMenu('dashboard');
                                }
                            } else {
                                document.querySelector('#top-navbar div:nth-child(2)').innerHTML = !userData.isVerified 
                                    ? '<span class="px-3 py-1 bg-red-100 text-red-700 rounded-full font-medium flex items-center text-sm"><i class="fas fa-times-circle mr-1"></i> Belum Diverifikasi</span>' 
                                    : '<span class="px-3 py-1 bg-green-100 text-green-700 rounded-full font-medium flex items-center text-sm"><i class="fas fa-check-circle mr-1"></i> Terverifikasi</span>';
                                switchMenu(currentView);
                            }
                        } else {
                            userData = { role: 'user', isVerified: false, email: user.email };
                            renderMainLayout();
                            subscribeData();
                        }
                        UI.hideLoading();
                    }, e => {
                        console.error("Error fetching user role", e);
                        UI.hideLoading();
                    }));
                } catch(e) {
                    console.error(e);
                    UI.hideLoading();
                }
            } else {
                unsubscribes.forEach(unsub => unsub());
                unsubscribes = [];
                userData = null;
                schoolData = {};
                userBKU = [];
                isSystemMaintenance = false;
                renderAuthScreen();
                UI.hideLoading();
            }
        });
    </script>
</body>
</html>
